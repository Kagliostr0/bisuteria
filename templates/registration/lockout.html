{% extends "base.html" %}

{% block title %}Cuenta bloqueada - Bisutería Dorada{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-12">
    <div class="flex items-center gap-3 mb-6">
        <div class="h-px flex-1 bg-gradient-to-r from-transparent via-gold-500 to-transparent"></div>
        <h1 class="font-heading text-xl font-bold text-gold-400 text-center gold-text-brillo">Cuenta Bloqueada</h1>
        <div class="h-px flex-1 bg-gradient-to-r from-transparent via-gold-500 to-transparent"></div>
    </div>
    <div class="bg-gray-800 rounded-xl p-6 border border-gray-700 text-center">
        <p class="text-gray-300 mb-4">Demasiados intentos fallidos. Tu cuenta ha sido bloqueada temporalmente.</p>
        <p class="text-gold-400 text-sm">Intentá de nuevo en 1 hora.</p>
        <a href="/" class="inline-block mt-6 bg-gold-600 text-black px-6 py-2 rounded-lg hover:bg-gold-500 transition font-bold">
            Volver al Inicio
        </a>
    </div>
</div>
{% endblock %}
